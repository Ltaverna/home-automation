- id: homekit_remote_lg
  alias: "HomeKit remote → botones LG"
  description: "Traduce las teclas del control del Centro de Control de iOS a webostv.button."
  mode: queued
  triggers:
    - trigger: event
      event_type: homekit_tv_remote_key_pressed
      event_data:
        entity_id: media_player.lg_webos_tv_oled55c3psa
  variables:
    keymap:
      arrow_up: UP
      arrow_down: DOWN
      arrow_left: LEFT
      arrow_right: RIGHT
      select: ENTER
      back: BACK
      exit: EXIT
      information: INFO
  actions:
    - choose:
        - conditions: "{{ trigger.event.data.key_name == 'play_pause' }}"
          sequence:
            - action: media_player.media_play_pause
              target:
                entity_id: media_player.lg_webos_tv_oled55c3psa
      default:
        - action: webostv.button
          data:
            entity_id: media_player.lg_webos_tv_oled55c3psa
            button: "{{ keymap[trigger.event.data.key_name] }}"

- id: house_mode_llegada
  alias: "House mode: llegada"
  description: >
    Geofence del iPhone pasa a home → HOME. En Fase 2 se suma la confirmación
    por sensor de puerta (spec: puerta abierta recientemente).
  triggers:
    - trigger: state
      entity_id: person.lucas
      to: "home"
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.house_mode
          state: "HOME"
  actions:
    - action: input_select.select_option
      target:
        entity_id: input_select.house_mode
      data:
        option: "HOME"
    - action: notify.mobile_app_lucass_iphone
      data:
        title: "🏠 Bienvenido"
        message: "Modo HOME activado."

- id: house_mode_salida
  alias: "House mode: salida"
  description: >
    iPhone not_home sostenido 5 min → AWAY (anti-flapping de geofence, spec:
    no apagar todo ante un único cambio). Apaga ambas TVs. En Fase 2 se suma
    la condición human_present=false (mmWave) y el respeto del modo CLEANING.
  triggers:
    - trigger: state
      entity_id: person.lucas
      to: "not_home"
      for: "00:05:00"
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.house_mode
          state: "CLEANING"
    - condition: state
      entity_id: input_boolean.modo_paseo
      state: "off"
  actions:
    - action: input_select.select_option
      target:
        entity_id: input_select.house_mode
      data:
        option: "AWAY"
    - action: media_player.turn_off
      target:
        entity_id:
          - media_player.lg_webos_tv_oled55c3psa
          - media_player.tv_dormitorio
      continue_on_error: true
    - action: notify.mobile_app_lucass_iphone
      data:
        title: "🚪 Casa vacía"
        message: "Modo AWAY: TVs apagadas."

- id: house_mode_noche
  alias: "House mode: noche (provisional)"
  description: >
    Provisional por horario: 23:30 estando en casa → NIGHT. En Fase 2 el trigger
    real es presencia en dormitorio + living vacío (mmWave).
  triggers:
    - trigger: time
      at: "23:30:00"
  conditions:
    - condition: state
      entity_id: person.lucas
      state: "home"
    - condition: state
      entity_id: input_select.house_mode
      state: "HOME"
  actions:
    - action: input_select.select_option
      target:
        entity_id: input_select.house_mode
      data:
        option: "NIGHT"

- id: house_mode_manana
  alias: "House mode: mañana"
  description: "Salir de NIGHT a las 07:00 si hay alguien en casa."
  triggers:
    - trigger: time
      at: "07:00:00"
  conditions:
    - condition: state
      entity_id: input_select.house_mode
      state: "NIGHT"
    - condition: state
      entity_id: person.lucas
      state: "home"
  actions:
    - action: input_select.select_option
      target:
        entity_id: input_select.house_mode
      data:
        option: "HOME"

- id: despertar_suave
  alias: "Despertar suave"
  description: "08:30 lun-vie estando en casa: TV dormitorio en Flow canal 14."
  triggers:
    - trigger: time
      at: "08:30:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: person.lucas
      state: "home"
  actions:
    - action: script.flow_canal_dormitorio
      data:
        canal: 14

- id: modo_paseo_inicio
  alias: "Modo paseo: inicio"
  description: "Al encender el switch modo_paseo, ejecuta las acciones de inicio."
  triggers:
    - trigger: state
      entity_id: input_boolean.modo_paseo
      to: "on"
  actions:
    - action: script.iniciar_paseo

- id: modo_paseo_fin
  alias: "Modo paseo: fin"
  description: "El timer llegó a 30 min o Lucas volvió a casa: se apaga el modo paseo."
  triggers:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.paseo
    - trigger: state
      entity_id: person.lucas
      to: "home"
  conditions:
    - condition: state
      entity_id: input_boolean.modo_paseo
      state: "on"
  actions:
    - action: timer.cancel
      target:
        entity_id: timer.paseo
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.modo_paseo
