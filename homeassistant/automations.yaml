- id: tv_living_wol
  alias: "TV living: WoL al pedir encendido"
  description: "El LG en deep-off no responde por webOS; este hook manda el magic packet."
  triggers:
    - trigger: webostv.turn_on
      entity_id: media_player.lg_webos_tv_oled55c3psa
  actions:
    - action: script.tv_living_encender

- id: webhook_flow_sala
  alias: "Webhook: Flow en la sala"
  description: "Para Atajos de iOS sin token: POST a /api/webhook/<id>."
  triggers:
    - trigger: webhook
      webhook_id: "goNLDUqlSbHTZ4WeFJDKmEIEvaiPivGM"
      allowed_methods: [POST]
      local_only: false
  actions:
    - action: script.turn_on
      target:
        entity_id: script.flow_sala

