tv_living_encender:
  alias: "Encender TV living (WoL)"
  icon: mdi:television
  sequence:
    - action: wake_on_lan.send_magic_packet
      data:
        mac: "38:06:E6:1C:26:70"

tv_dormitorio_encender:
  alias: "Encender TV dormitorio (WoL)"
  icon: mdi:television
  sequence:
    - action: wake_on_lan.send_magic_packet
      data:
        mac: "68:72:C3:80:C4:A8"

flow_canal:
  alias: "Flow: poner canal (living)"
  icon: mdi:television-guide
  description: >
    Abre Flow si no está activo y zapea al canal indicado mandando los dígitos
    + ENTER. Acepta número (canal: 24) o nombre de la grilla (nombre: telefe).
    Los dígitos solo actúan si Flow está reproduciendo TV en vivo (no en el menú).
  fields:
    canal:
      name: Canal
      description: "Número de canal de Flow (ej. 24)"
      required: false
      example: 24
    nombre:
      name: Nombre
      description: "Nombre del canal según la grilla (ej. telefe)"
      required: false
      example: "telefe"
  variables:
    # Grilla Flow (completar con la guía de la TV; claves en minúsculas sin espacios)
    grilla:
      telefe: 10
    canal_num: >-
      {% if canal is defined and canal | string | trim != '' %}
        {{ canal }}
      {% else %}
        {{ grilla.get(nombre | default('') | lower | replace(' ', ''), 0) }}
      {% endif %}
  sequence:
    - condition: template
      value_template: "{{ canal_num | int(0) > 0 }}"
    - if:
        - condition: template
          value_template: >
            {{ state_attr('media_player.lg_webos_tv_oled55c3psa', 'source') != 'Flow' }}
      then:
        - action: media_player.select_source
          target:
            entity_id: media_player.lg_webos_tv_oled55c3psa
          data:
            source: "Flow"
        - delay: "00:00:12"
    - repeat:
        for_each: "{{ canal_num | string | trim | list }}"
        sequence:
          - action: webostv.button
            data:
              entity_id: media_player.lg_webos_tv_oled55c3psa
              button: "{{ repeat.item }}"
          - delay:
              milliseconds: 400
    - action: webostv.button
      data:
        entity_id: media_player.lg_webos_tv_oled55c3psa
        button: "ENTER"

flow_sala:
  alias: "Flow en la sala"
  icon: mdi:television-play
  description: "Enciende la TV del living si hace falta y abre Flow. Pensado para Siri/Assist."
  sequence:
    - action: script.tv_app
      data:
        app: "Flow"

flow_canal_dormitorio:
  alias: "Flow: poner canal (dormitorio)"
  icon: mdi:television-guide
  description: >
    Manda los dígitos + ENTER al Samsung por remote.send_command. Requiere que
    la app Flow ya esté abierta reproduciendo TV en vivo (el samsungtv nativo
    no puede lanzar apps en modelos 2020+; ver pendientes: ha-samsungtv-smart).
  fields:
    canal:
      name: Canal
      description: "Número de canal de Flow (ej. 24)"
      required: true
      example: 24
  sequence:
    - repeat:
        for_each: "{{ canal | string | trim | list }}"
        sequence:
          - action: remote.send_command
            target:
              entity_id: remote.lucass_tv_60ta
            data:
              command: "KEY_{{ repeat.item }}"
          - delay:
              milliseconds: 400
    - action: remote.send_command
      target:
        entity_id: remote.lucass_tv_60ta
      data:
        command: "KEY_ENTER"

tv_app:
  alias: "TV living: abrir app"
  icon: mdi:apps
  description: >
    Abre una app en el LG por nombre exacto del source_list:
    YouTube, Netflix, MUBI, Disney+, HBO Max, Prime Video, Spotify – Música y
    podcasts, Plex, Apple TV, Flow, TV en Vivo, etc. Si la TV está apagada,
    la despierta por WoL primero.
  fields:
    app:
      name: App
      description: "Nombre exacto de la app (ver source_list)"
      required: true
      example: "Netflix"
  sequence:
    - if:
        - condition: template
          value_template: "{{ states('media_player.lg_webos_tv_oled55c3psa') in ('off', 'unavailable') }}"
      then:
        - action: script.tv_living_encender
        - wait_template: "{{ states('media_player.lg_webos_tv_oled55c3psa') not in ('off', 'unavailable') }}"
          timeout: "00:00:30"
    - action: media_player.select_source
      target:
        entity_id: media_player.lg_webos_tv_oled55c3psa
      data:
        source: "{{ app }}"
