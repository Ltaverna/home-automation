# Package salud: alerta de servicios caídos (observabilidad).

automation:
  - id: salud_alerta
    alias: "Salud: alerta de servicio"
    description: "Notifica al iPhone cuando un servicio no-core cae o se recupera (transición)."
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.salud_face_embed
          - binary_sensor.salud_mcp
        to: "on"
        id: caido
      - trigger: state
        entity_id:
          - binary_sensor.salud_face_embed
          - binary_sensor.salud_mcp
        to: "off"
        id: recuperado
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unknown', 'unavailable', 'None'] }}"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: caido
            sequence:
              - action: notify.mobile_app_lucass_iphone
                data:
                  title: "⚠️ Servicio caído"
                  message: "{{ trigger.to_state.attributes.friendly_name }} no responde."
        default:
          - action: notify.mobile_app_lucass_iphone
            data:
              title: "✅ Servicio recuperado"
              message: "{{ trigger.to_state.attributes.friendly_name }} volvió a responder."

  - id: nodo_alerta
    alias: "Nodo: alerta de recursos"
    description: >-
      Alerta accionable sobre la salud del host R2130 (disco, temperatura CPU, SMART del NVMe,
      antigüedad del backup off-site).
      Los triggers numéricos disparan una sola vez al cruzar el umbral (anti-spam); el 'for'
      evita picos transitorios.
    triggers:
      - trigger: numeric_state
        entity_id: sensor.node_disk
        above: 85
        for: { minutes: 5 }
        id: disco
      - trigger: numeric_state
        entity_id: sensor.node_temp_cpu
        above: 80
        for: { minutes: 2 }
        id: temp_cpu
      - trigger: state
        entity_id: binary_sensor.node_nvme_smart
        to: "on"
        id: smart
      - trigger: numeric_state
        entity_id: sensor.node_last_backup_age
        above: 36
        id: backup
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: disco
            sequence:
              - action: notify.mobile_app_lucass_iphone
                data:
                  title: "⚠️ Disco NVMe lleno"
                  message: "El disco / del R2130 está al {{ states('sensor.node_disk') }}%."
          - conditions:
              - condition: trigger
                id: temp_cpu
            sequence:
              - action: notify.mobile_app_lucass_iphone
                data:
                  title: "🌡️ CPU caliente"
                  message: "La CPU del R2130 está a {{ states('sensor.node_temp_cpu') }}°C."
          - conditions:
              - condition: trigger
                id: backup
            sequence:
              - action: notify.mobile_app_lucass_iphone
                data:
                  title: "🗄️ Backup off-site atrasado"
                  message: "El último backup a R2 tiene {{ states('sensor.node_last_backup_age') }} h. Revisar restic/cron."
        default:
          - action: notify.mobile_app_lucass_iphone
            data:
              title: "💾 SMART del NVMe: FALLA"
              message: "smartctl reporta un problema en el NVMe del R2130. Revisar urgente (backup off-site al día)."
