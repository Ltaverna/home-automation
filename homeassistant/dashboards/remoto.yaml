title: Control remoto
views:
  - title: Sala (LG)
    path: sala
    icon: mdi:sofa
    cards:
      - type: grid
        columns: 3
        square: true
        cards:
          - type: button
            icon: mdi:arrow-left
            name: Atrás
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: BACK }
          - type: button
            icon: mdi:chevron-up
            name: " "
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: UP }
          - type: button
            icon: mdi:home
            name: Home
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: HOME }
          - type: button
            icon: mdi:chevron-left
            name: " "
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: LEFT }
          - type: button
            icon: mdi:circle-slice-8
            name: OK
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: ENTER }
          - type: button
            icon: mdi:chevron-right
            name: " "
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: RIGHT }
          - type: button
            icon: mdi:exit-to-app
            name: Salir
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: EXIT }
          - type: button
            icon: mdi:chevron-down
            name: " "
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: DOWN }
          - type: button
            icon: mdi:play-pause
            name: Play/Pausa
            tap_action:
              action: call-service
              service: media_player.media_play_pause
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa }
      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            icon: mdi:volume-minus
            name: Vol −
            tap_action:
              action: call-service
              service: media_player.volume_down
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa }
          - type: button
            icon: mdi:volume-mute
            name: Mute
            tap_action:
              action: call-service
              service: media_player.volume_mute
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, is_volume_muted: true }
          - type: button
            icon: mdi:volume-plus
            name: Vol +
            tap_action:
              action: call-service
              service: media_player.volume_up
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa }
          - type: button
            icon: mdi:chevron-double-down
            name: Canal −
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: CHANNELDOWN }
          - type: button
            icon: mdi:television-classic
            name: TV
            tap_action:
              action: call-service
              service: media_player.select_source
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, source: "TV en Vivo" }
          - type: button
            icon: mdi:chevron-double-up
            name: Canal +
            tap_action:
              action: call-service
              service: webostv.button
              data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: CHANNELUP }
      - type: grid
        title: Dígitos
        columns: 3
        square: false
        cards:
          - type: button
            name: "1"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "1" } }
          - type: button
            name: "2"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "2" } }
          - type: button
            name: "3"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "3" } }
          - type: button
            name: "4"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "4" } }
          - type: button
            name: "5"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "5" } }
          - type: button
            name: "6"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "6" } }
          - type: button
            name: "7"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "7" } }
          - type: button
            name: "8"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "8" } }
          - type: button
            name: "9"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "9" } }
          - type: button
            icon: mdi:backspace-outline
            name: Atrás
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: BACK } }
          - type: button
            name: "0"
            show_icon: false
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: "0" } }
          - type: button
            icon: mdi:check-bold
            name: OK
            tap_action: { action: call-service, service: webostv.button, data: { entity_id: media_player.lg_webos_tv_oled55c3psa, button: ENTER } }
      - type: entities
        title: Apps rápidas
        entities:
          - switch.flow_sala
          - switch.netflix_sala
          - switch.youtube_sala
      - type: media-control
        entity: media_player.lg_webos_tv_oled55c3psa

