# Config base — Home Assistant genera el resto en .storage/ (fuera de git)
default_config:

# tailscale serve (reverse proxy local) → HTTPS en https://r2130.tail71f19f.ts.net
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

homeassistant:
  name: Depto
  time_zone: America/Argentina/Buenos_Aires
  unit_system: metric
  currency: ARS
  country: AR

# WoL para encender las TVs (LG 38:06:E6:1C:26:70, Samsung 68:72:C3:80:C4:A8)
wake_on_lan:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
