# Config base — Home Assistant genera el resto en .storage/ (fuera de git)
default_config:

# tailscale serve (reverse proxy local) → HTTPS en https://r2130.tail71f19f.ts.net
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

homeassistant:
  name: Depto
  time_zone: America/Argentina/Buenos_Aires
  unit_system: metric
  currency: ARS
  country: AR

# WoL para encender las TVs (LG 38:06:E6:1C:26:70, Samsung 68:72:C3:80:C4:A8)
wake_on_lan:

# Estados globales de la casa (spec §house modes). CINEMA es escena, no estado.
# CLEANING se automatiza en Fase 2+ (necesita sensor de puerta + schedule + mmWave).
input_select:
  house_mode:
    name: Modo de la casa
    options:
      - HOME
      - AWAY
      - CLEANING
      - NIGHT
    icon: mdi:home-account

# Switches que envuelven scripts, porque las acciones de Atajos de iOS
# (App Intents) solo listan ciertos dominios y los scripts no aparecen.
# ON = abrir app (enciende TV por WoL si hace falta) / OFF = apagar TV.
template:
  - switch:
      - name: "Flow sala"
        unique_id: flow_sala_switch
        icon: mdi:television-play
        state: "{{ is_state_attr('media_player.lg_webos_tv_oled55c3psa', 'source', 'Flow') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.flow_sala
        turn_off:
          - action: media_player.turn_off
            target:
              entity_id: media_player.lg_webos_tv_oled55c3psa
      - name: "Netflix sala"
        unique_id: netflix_sala_switch
        icon: mdi:netflix
        state: "{{ is_state_attr('media_player.lg_webos_tv_oled55c3psa', 'source', 'Netflix') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.netflix_sala
        turn_off:
          - action: media_player.turn_off
            target:
              entity_id: media_player.lg_webos_tv_oled55c3psa
      - name: "YouTube sala"
        unique_id: youtube_sala_switch
        icon: mdi:youtube
        state: "{{ is_state_attr('media_player.lg_webos_tv_oled55c3psa', 'source', 'YouTube') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.youtube_sala
        turn_off:
          - action: media_player.turn_off
            target:
              entity_id: media_player.lg_webos_tv_oled55c3psa
      - name: "Flow dormitorio"
        unique_id: flow_dormitorio_switch
        icon: mdi:television-play
        state: "{{ is_state_attr('media_player.tv_dormitorio', 'app_id', 'fCCrJTSe28.Flow') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.flow_dormitorio
        turn_off:
          - action: media_player.turn_off
            target:
              entity_id: media_player.tv_dormitorio
      - name: "Netflix dormitorio"
        unique_id: netflix_dormitorio_switch
        icon: mdi:netflix
        state: "{{ is_state_attr('media_player.tv_dormitorio', 'app_id', 'org.tizen.netflix-app') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.netflix_dormitorio
        turn_off:
          - action: media_player.turn_off
            target:
              entity_id: media_player.tv_dormitorio
      - name: "YouTube dormitorio"
        unique_id: youtube_dormitorio_switch
        icon: mdi:youtube
        state: "{{ is_state_attr('media_player.tv_dormitorio', 'app_id', '9Ur5IzDKqV.TizenYouTube') }}"
        turn_on:
          - action: script.turn_on
            target:
              entity_id: script.youtube_dormitorio
        turn_off:
          - action: media_player.turn_off
            target:
              entity_id: media_player.tv_dormitorio

# Dashboard "Control remoto" versionado en git (d-pad de ambas TVs)
lovelace:
  dashboards:
    remoto-tv:
      mode: yaml
      title: Control remoto
      icon: mdi:remote-tv
      show_in_sidebar: true
      filename: dashboards/remoto.yaml

# Puente a Apple Home: Siri nativo para los switches de apps de la sala.
# El pairing se hace una vez desde la notificación que aparece en HA.
# Segunda instancia en modo accessory: la TV LG como "HomeKit TV" → habilita
# el control remoto del Centro de Control de iOS (las teclas llegan como
# eventos homekit_tv_remote_key_pressed, mapeados en automations.yaml).
homekit:
  - name: HASS Bridge
    port: 21063
    filter:
      include_entities:
        - switch.flow_sala
        - switch.netflix_sala
        - switch.youtube_sala
        - switch.flow_dormitorio
        - switch.netflix_dormitorio
        - switch.youtube_dormitorio
  - name: TV Sala
    port: 21064
    mode: accessory
    filter:
      include_entities:
        - media_player.lg_webos_tv_oled55c3psa

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
