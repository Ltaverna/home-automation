# Config base — Home Assistant genera el resto en .storage/ (fuera de git)
# La config por feature vive en packages/ (tv, house_mode, paseo, seguridad, face, salud).
default_config:

# tailscale serve (reverse proxy local) → HTTPS en https://r2130.tail71f19f.ts.net
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

homeassistant:
  name: Depto
  time_zone: America/Argentina/Buenos_Aires
  unit_system: metric
  currency: ARS
  country: AR
  # URL canónica de HA para clientes remotos = Tailscale (llega al login de HA, sin puerto).
  # El MCP usa su propio server_url (ha-mcp.neuralcore.dev), NO el external_url de HA.
  external_url: "https://r2130.tail71f19f.ts.net"
  internal_url: "http://192.168.1.17:8123"
  # Config modular por feature (cada archivo agrupa automations + scripts + helpers)
  packages: !include_dir_named packages/

# Dashboard "Control remoto" versionado en git (d-pad de ambas TVs)
lovelace:
  dashboards:
    remoto-tv:
      mode: yaml
      title: Control remoto
      icon: mdi:remote-tv
      show_in_sidebar: true
      filename: dashboards/remoto.yaml

# Puente a Apple Home: Siri nativo para los switches de apps + el remote del LG.
# Transversal (cruza features tv/paseo/seguridad), por eso queda en el core y no en un package.
homekit:
  - name: HASS Bridge
    port: 21063
    filter:
      include_entities:
        - switch.flow_sala
        - switch.netflix_sala
        - switch.youtube_sala
        - switch.flow_dormitorio
        - switch.netflix_dormitorio
        - switch.youtube_dormitorio
        - input_boolean.modo_paseo
        - input_boolean.modo_simulacion
  - name: TV Sala
    port: 21064
    mode: accessory
    filter:
      include_entities:
        - media_player.lg_webos_tv_oled55c3psa

# automations.yaml y scripts.yaml quedaron vacíos: todo migró a packages/.
# Se mantiene el !include (inocuo) para no dejar HA sin estas keys.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
