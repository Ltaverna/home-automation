name: home-automation

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TZ}

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ}
    depends_on:
      - mosquitto

  # Túnel dedicado Cloudflare para exponer el endpoint MCP a clientes en la nube.
  # Aislado de los otros túneles de la R2130 (helmet-detection/consorcio/crypto-bot).
  # credentials (cloudflared/ha-mcp.json) fuera de git; config sin secretos.
  cloudflared-mcp:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-mcp
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"   # uid de pi, dueño de cloudflared/ha-mcp.json (mantiene 600)
    command: tunnel --no-autoupdate --config /etc/cloudflared/config-mcp.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - homeassistant
