name: home-automation

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TZ}

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ}
    depends_on:
      - mosquitto

  # FaceEmbed API (reconocimiento facial en Hailo-8, proyecto experimental).
  # HailoRT 4.20 en el contenedor + /dev/hailo0 del host. DB SQLite en volumen.
  face-embed:
    build: ./face-embed
    container_name: face-embed
    profiles: ["face"]
    restart: unless-stopped
    devices:
      - /dev/hailo0:/dev/hailo0
    volumes:
      - ./face-embed/data:/app/data
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ}

  # Loop de reconocimiento facial → MQTT (consume face-embed, publica a Home Assistant).
  face-recognizer:
    build: ./face-recognizer
    container_name: face-recognizer
    profiles: ["face"]
    restart: unless-stopped
    devices:
      - /dev/video0:/dev/video0
    environment:
      - TZ=${TZ}
      - MQTT_HOST=mosquitto
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - FACE_EMBED_URL=http://face-embed:8000
    depends_on:
      - mosquitto
      - face-embed

  # Monitor de salud: health-checks HTTP → MQTT (sensores en HA) + dead-man switch externo.
  healthmon:
    build: ./healthmon
    container_name: healthmon
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MQTT_HOST=mosquitto
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - HEALTHCHECKS_URL=${HEALTHCHECKS_URL}
      - NODE_IP=192.168.1.17
    depends_on:
      - mosquitto

  # Túnel dedicado Cloudflare para exponer el endpoint MCP a clientes en la nube.
  # Aislado de los otros túneles de la R2130 (helmet-detection/consorcio/crypto-bot).
  # credentials (cloudflared/ha-mcp.json) fuera de git; config sin secretos.
  cloudflared-mcp:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cloudflared-mcp
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"   # uid de pi, dueño de cloudflared/ha-mcp.json (mantiene 600)
    command: tunnel --no-autoupdate --config /etc/cloudflared/config-mcp.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - homeassistant
